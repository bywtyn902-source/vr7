name: Build Dylib with Theos

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Theos Environment
      run: |
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/* $THEOS/sdks/
        rm -rf sdks-master master.zip

    - name: Build Tweak (.dylib)
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v3
      with:
        name: RobloxModMenu-Dylib
        path: .theos/obj/debug/*.dylib
